spring.r2dbc.url=r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:test-schema.sql
spring.sql.init.data-locations=
logging.level.org.springframework.r2dbc=DEBUG
logging.level.io.r2dbc.h2=DEBUG

# Keep the InMemoryEventBus for core functionality, only use Kafka for the bridge
eventbus.enabled=true

# Enable the Kafka bridge for integration tests
transferer.eventbus.bridge.enabled=true
transferer.kafka.topic.events=test-domain-events